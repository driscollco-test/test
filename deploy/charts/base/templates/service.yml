apiVersion: v1
kind: Service
metadata:
  name: {{ include "universal.fullname" . }}
  namespace: {{ include "universal.namespace" . }}
  labels:
{{ include "universal.labels" . | nindent 4 }}
  {{- with .Values.metadata.labels }}
{{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.metadata.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
{{ include "universal.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ default 80 .Values.ingress.port }}
      targetPort: {{ default 80 .Values.container.port }}
      protocol: TCP