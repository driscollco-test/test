{{- $repo := .Values.image.repository | default .Values.name -}}
{{- $tag := .Values.image.tag | default "latest" -}}

{{- $files := default (dict) .Values.files -}}
{{- $hasFiles := gt (len (keys $files)) 0 -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "universal.fullname" . }}
  namespace: {{ include "universal.namespace" . }}
  labels:
{{ include "universal.labels" . | nindent 4 }}
{{ with .Values.metadata.labels }}
{{ toYaml . | nindent 4 }}
{{ end }}
{{ with .Values.metadata.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
{{ end }}

spec:
  replicas: {{ default 1 .Values.instances }}

  selector:
    matchLabels:
{{ include "universal.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
{{ include "universal.selectorLabels" . | nindent 8 }}
{{ with .Values.metadata.labels }}
{{ toYaml . | nindent 8 }}
{{ end }}
      annotations:
        kubectl.kubernetes.io/restartedAt: "{{ now | date "2006-01-02T15:04:05Z07:00" }}"
{{ with .Values.metadata.annotations }}
{{ toYaml . | nindent 8 }}
{{ end }}

    spec:

{{ with .Values.settings.serviceAccountName }}
{{ if ne . "" }}
      serviceAccountName: {{ . | quote }}
{{ end }}
{{ end }}

{{ with .Values.image.pullSecrets }}
{{ if gt (len (keys .)) 0 }}
      imagePullSecrets:
{{- $k := keys . | sortAlpha }}
{{- range $i, $name := $k }}
        - name: {{ $name | quote }}
{{- end }}
{{ end }}
{{ end }}

      containers:
        - name: {{ include "universal.fullname" . }}

          image: {{ printf "%s:%s" $repo $tag | quote }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ default 80 .Values.container.port }}

{{ with .Values.container.command }}
{{ if gt (len (keys .)) 0 }}
          command:
{{- $keys := keys . | sortAlpha }}
{{- range $i, $k := $keys }}
            - {{ (index $.Values.container.command $k) | quote }}
{{- end }}
{{ end }}
{{ end }}

{{ with .Values.container.args }}
{{ if gt (len (keys .)) 0 }}
          args:
{{- $keys := keys . | sortAlpha }}
{{- range $i, $k := $keys }}
            - {{ (index $.Values.container.args $k) | quote }}
{{- end }}
{{ end }}
{{ end }}

{{ with .Values.settings.resources }}
{{ if gt (len (keys .)) 0 }}
          resources:
{{ toYaml . | nindent 12 }}
{{ end }}
{{ end }}

{{- $env := .Values.variables.environment -}}
{{- $sec := .Values.variables.secrets -}}
{{- $hasEnv := and $env (gt (len (keys $env)) 0) -}}
{{- $hasSec := and $sec (gt (len (keys $sec)) 0) -}}

{{ if or $hasEnv $hasSec }}
          env:
{{ if $hasEnv }}
{{ $keys := keys $env | sortAlpha }}
{{ range $i, $k := $keys }}
            - name: {{ $k | quote }}
              value: {{ (index $env $k) | quote }}
{{ end }}
{{ end }}

{{ if $hasSec }}
{{ $keys := keys $sec | sortAlpha }}
{{ range $i, $k := $keys }}
{{ $s := index $sec $k }}
{{ if and $s.secret $s.key }}
            - name: {{ $k | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $s.secret | quote }}
                  key: {{ $s.key | quote }}
{{ else }}
{{ fail (printf "variables.secrets.%s must have 'secret' and 'key'" $k) }}
{{ end }}
{{ end }}
{{ end }}
{{ end }}

{{ with .Values.container.probes.readiness }}
          readinessProbe:
{{ toYaml . | nindent 12 }}
{{ end }}

{{ with .Values.container.probes.liveness }}
          livenessProbe:
{{ toYaml . | nindent 12 }}
{{ end }}

{{ with .Values.container.probes.startup }}
          startupProbe:
{{ toYaml . | nindent 12 }}
{{ end }}

{{ if $hasFiles }}
          volumeMounts:
{{- $names := keys $files | sortAlpha }}
{{- range $i, $name := $names }}
{{- $f := index $files $name }}
{{- if not $f.destination }}{{ fail (printf "files.%s is missing 'destination'" $name) }}{{ end }}
{{- $destDir := dir $f.destination }}
            - name: file-{{ $name }}
              mountPath: {{ $destDir | quote }}
              readOnly: true
{{- end }}
{{ end }}

{{ if $hasFiles }}
      volumes:
{{- $names := keys $files | sortAlpha }}
{{- range $i, $name := $names }}
{{- $f := index $files $name }}
{{- $destBase := base $f.destination }}
        - name: file-{{ $name }}
          configMap:
            name: {{ include "universal.fullname" $ }}-files
            items:
              - key: {{ $name | quote }}
                path: {{ $destBase | quote }}
{{- end }}
{{ end }}